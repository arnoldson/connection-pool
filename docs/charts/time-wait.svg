<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-labelledby="t d">
<title id="t">A-side TIME_WAIT sockets during the load</title>
<desc id="d">TIME_WAIT over time. before climbs to the 28,232-port limit by about 30 s and stays near it; mitigation levels off around 14,041; pool and jetty stay near zero.</desc>
